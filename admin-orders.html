<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Orders | Become Pro</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/index.html" aria-label="Become Pro начало">
      <span class="brand-mark"><img src="/assets/become-pro-logo.png" alt="" /></span>
      <strong>BECOME PRO</strong>
    </a>
    <div class="header-actions"><button class="header-cta" type="button" data-admin-logout>Изход</button></div>
  </header>

  <main class="admin-page section-dark">
    <section class="admin-shell">
      <div class="section-heading">
        <p class="eyebrow">Admin</p>
        <h1>Поръчки</h1>
        <p>Защитен панел за преглед на онлайн поръчките и техния статус.</p>
      </div>

      <section class="admin-orders" data-admin-orders>
        <div class="admin-toolbar">
          <strong data-admin-count>0 поръчки</strong>
          <button class="btn btn-secondary admin-refresh" type="button" data-admin-refresh>Refresh orders</button>
        </div>

        <div class="admin-controls">
          <label class="admin-search">
            <span>Търсене</span>
            <input type="search" placeholder="Име, имейл или програма" data-admin-search />
          </label>
          <div class="admin-filter" data-admin-filter aria-label="Филтър по статус">
            <button class="is-active" type="button" data-admin-status-filter="all">All</button>
            <button type="button" data-admin-status-filter="paid">Paid</button>
            <button type="button" data-admin-status-filter="pending">Pending</button>
            <button type="button" data-admin-status-filter="failed">Failed</button>
            <button type="button" data-admin-status-filter="expired">Expired</button>
          </div>
        </div>

        <p class="admin-state admin-empty" data-admin-empty hidden>Все още няма поръчки.</p>
        <p class="admin-state admin-error" data-admin-error hidden></p>

        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Дата</th>
                <th>Име на клиент</th>
                <th>Имейл</th>
                <th>Телефон</th>
                <th>Закупена програма</th>
                <th>Цена</th>
                <th>Статус</th>
                <th>Stripe Session ID</th>
                <th>Program Link</th>
              </tr>
            </thead>
            <tbody data-admin-table></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

  <script src="/admin-orders.js"></script>
</body>
</html>
