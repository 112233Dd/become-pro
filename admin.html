<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | Become Pro</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Become Pro начало">
      <span class="brand-mark"><img src="assets/become-pro-logo.png" alt="" /></span>
      <strong>BECOME PRO</strong>
    </a>
    <div class="header-actions"><a class="header-cta" href="programs.html#programs">Програми</a></div>
  </header>
  <main class="admin-page section-dark">
    <section class="admin-shell">
      <div class="section-heading">
        <p class="eyebrow">Admin</p>
        <h1>Поръчки</h1>
        <p>Защитен панел за преглед на платени, pending, failed и cancelled поръчки.</p>
      </div>

      <form class="admin-login-card" data-admin-login>
        <label>Admin имейл<input type="email" name="email" required autocomplete="username" /></label>
        <label>Парола<input type="password" name="password" required autocomplete="current-password" /></label>
        <button class="btn btn-primary" type="submit">Вход</button>
        <p class="form-status" data-admin-status aria-live="polite"></p>
      </form>

      <section class="admin-orders" data-admin-orders hidden>
        <div class="admin-toolbar">
          <strong data-admin-count>0 поръчки</strong>
          <button class="btn btn-secondary" type="button" data-admin-logout>Изход</button>
        </div>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Клиент</th>
                <th>Контакт</th>
                <th>Програма</th>
                <th>Цена</th>
                <th>Статус</th>
                <th>Дата</th>
                <th>Stripe Session</th>
                <th>Линк</th>
              </tr>
            </thead>
            <tbody data-admin-table></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>
  <script src="admin.js"></script>
</body>
</html>
