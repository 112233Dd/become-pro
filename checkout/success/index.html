<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Успешна покупка | Become Pro</title>
    <meta name="description" content="Онлайн футболни програми и индивидуални тренировки за футболисти." />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#050505" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Become Pro" />
    <meta property="og:title" content="Become Pro" />
    <meta property="og:description" content="Онлайн футболни програми и индивидуални тренировки за футболисти." />
    <meta property="og:image" content="https://becomeprofootball.com/assets/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Become Pro" />
    <meta name="twitter:description" content="Онлайн футболни програми и индивидуални тренировки за футболисти." />
    <meta name="twitter:image" content="https://becomeprofootball.com/assets/og-image.png" />
    <link rel="canonical" href="https://becomeprofootball.com/checkout/success" />

<link rel="stylesheet" href="../../styles.min.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../../index.html" aria-label="Become Pro начало">
      <span class="brand-mark"><img src="../../assets/becomepro-logo-compact.webp" alt="Become Pro logo" /></span>
      <strong>BECOME PRO</strong>
    </a>
    <nav class="main-nav" aria-label="Основна навигация">
      <a href="../../programs.html">Програми</a>
      <a href="/individual-training">Индивидуални тренировки</a>
      <a href="../../coach.html">За треньора</a>
      <a href="../../players.html">Играчи</a>
      <a href="../../faq.html">Често задавани въпроси</a>
      <a href="../../contact.html">Контакти</a>
    </nav>
    <div class="header-actions"><a class="header-cta" href="../../programs.html#programs">Виж още програми</a></div>
  </header>
    <div class="mobile-quick-actions" aria-label="Бързи действия">
      <a href="../../programs.html#programs">Програми</a>
      <a href="/individual-training">Тренировка</a>
    </div>

  <main class="payment-result section-dark">
    <section class="payment-card reveal">
      <p class="eyebrow" data-payment-eyebrow>Проверка на плащането</p>
      <h1 data-payment-title>Проверяваме покупката...</h1>
      <p data-payment-message>Моля, изчакай за момент, докато потвърдим плащането със Stripe.</p>
      <div class="payment-actions">
        <a class="btn btn-primary" href="#" data-program-access hidden>Отвори програмата</a>
        <a class="btn btn-primary" href="../../programs.html#programs">Виж още програми</a>
        <a class="btn btn-secondary" href="../../contact.html">Свържи се с нас</a>
      </div>
    </section>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get("session_id");
    const eyebrow = document.querySelector("[data-payment-eyebrow]");
    const title = document.querySelector("[data-payment-title]");
    const message = document.querySelector("[data-payment-message]");
    const accessLink = document.querySelector("[data-program-access]");
    const showError = (text) => {
      eyebrow.textContent = "Плащането не е потвърдено";
      title.textContent = "Не успяхме да потвърдим покупката.";
      message.textContent = text;
    };
    if (sessionId) {
      fetch(`/api/checkout-session?session_id=${encodeURIComponent(sessionId)}`)
        .then((response) => response.ok ? response.json() : Promise.reject(new Error("Невалидна или изтекла Stripe сесия.")))
        .then((data) => {
          if (data?.paymentStatus !== "paid") {
            eyebrow.textContent = "Плащането се обработва";
            title.textContent = "Все още очакваме потвърждение.";
            message.textContent = "Не затваряй страницата. Провери отново след кратко изчакване или се свържи с нас, ако сумата е начислена.";
            return;
          }
          eyebrow.textContent = "Успешно плащане";
          title.textContent = "Покупката е успешна. Благодарим ти!";
          message.textContent = `Достъпът до ${data.programName || "закупената програма"} е готов. Изпратихме линк и на имейла, използван при плащането.`;
          if (data.accessUrl) {
            accessLink.href = data.accessUrl;
            accessLink.hidden = false;
          }
        })
        .catch((error) => showError(error.message || "Провери линка или се свържи с нас за съдействие."));
    } else {
      showError("В адреса липсва Stripe сесия. Ако си направил плащане, свържи се с нас за проверка.");
    }
  </script>
</body>
</html>
